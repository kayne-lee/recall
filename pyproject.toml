[project]
name = "recall"
version = "0.1.0"
description = "Episodic and semantic memory for LLM agents, with consolidation, forgetting, and a benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kayne Lee" }]
dependencies = [
    "anthropic>=0.69",
    "numpy>=2.1",
    "sentence-transformers>=3.3",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.uv]
# Use uv's own interpreters, never whatever Python happens to be on PATH.
# pyenv builds CPython without --enable-loadable-sqlite-extensions on macOS, so a
# pyenv interpreter cannot load sqlite-vec at all — sqlite3.Connection has no
# enable_load_extension attribute. Managed builds have it. Since the whole store
# depends on that extension, the interpreter is not a free choice.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/recall"]
